[project]
name = "howhow"
version = "0.1.0"
description = "Provider-neutral evidence-first research contracts"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.11.7", "typer==0.16.0"]

[project.scripts]
howhow = "howhow.cli:app"

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.7", "mypy==1.17.1"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/howhow"]
