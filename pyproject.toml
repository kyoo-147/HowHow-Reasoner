[project]
name = "howhow"
version = "0.1.0"
description = "Provider-neutral evidence-first research contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "numpy==2.3.2",
    "pydantic==2.11.7",
    "typer==0.16.0",
    "uvicorn==0.35.0",
]

[project.scripts]
howhow = "howhow.cli:app"
supply-chain-audit = "scripts.audit_supply_chain:main"

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.7",
    "mypy==1.17.1",
    "httpx==0.28.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = ["real_miktex: optional smoke test requiring a local TeX installation"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/howhow"]
